<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOSTÜ Staj Defteri Otomasyonu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --kostu-lacivert: #0A2240;
            --kostu-turuncu: #E85D04;
            --kostu-turuncu-hover: #CC5203;
            --bg-color: #F4F7F9;
            --card-bg: #FFFFFF;
            --text-main: #333333;
            --text-muted: #6B7280;
            --border-color: #D1D5DB;
            --input-focus-ring: rgba(232, 93, 4, 0.15);
            --locked-bg: #F3F4F6;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); padding: 40px 20px; margin: 0; line-height: 1.6; }
        .container { max-width: 850px; margin: 0 auto; background: var(--card-bg); padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-top: 6px solid var(--kostu-lacivert); }
        .header-section { text-align: center; margin-bottom: 30px; }
        .header-section h2 { color: var(--kostu-lacivert); font-weight: 700; font-size: 24px; margin: 0 0 10px 0; }
        .header-section p { color: var(--text-muted); font-size: 14px; margin: 0; }
        h3 { color: var(--kostu-lacivert); font-size: 18px; margin-top: 35px; margin-bottom: 20px; padding-bottom: 8px; border-bottom: 2px solid var(--border-color); position: relative; }
        h3::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 60px; height: 2px; background-color: var(--kostu-turuncu); }
        .form-row { display: flex; gap: 20px; flex-wrap: wrap; }
        .form-group { margin-bottom: 20px; flex: 1; min-width: 250px; }
        .form-group.full-width { flex: 100%; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--kostu-lacivert); font-size: 14px; }
        input[type="text"], input[type="number"], input[type="date"], input[type="time"], select { width: 100%; padding: 12px 15px; border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box; font-size: 15px; color: var(--text-main); transition: all 0.3s ease; font-family: 'Inter', sans-serif; background-color: #fff; }
        input[type="file"] { width: 100%; padding: 10px; border: 1px dashed var(--border-color); border-radius: 8px; box-sizing: border-box; font-size: 14px; color: var(--text-muted); background-color: #FAFAFA; cursor: pointer; transition: all 0.3s ease; }
        input[type="file"]:hover { border-color: var(--kostu-turuncu); }
        input:focus, select:focus { outline: none; border-color: var(--kostu-turuncu); box-shadow: 0 0 0 4px var(--input-focus-ring); }
        .locked-input { background-color: var(--locked-bg) !important; color: var(--text-muted) !important; cursor: not-allowed; pointer-events: none; border-color: var(--border-color) !important; }
        .btn-submit { background-color: var(--kostu-turuncu); color: white; border: none; cursor: pointer; width: 100%; font-size: 16px; margin-top: 30px; padding: 16px; border-radius: 8px; font-weight: 700; letter-spacing: 0.5px; transition: all 0.3s ease; box-shadow: 0 4px 6px rgba(232, 93, 4, 0.2); }
        .btn-submit:hover { background-color: var(--kostu-turuncu-hover); transform: translateY(-2px); box-shadow: 0 6px 12px rgba(232, 93, 4, 0.3); }
        .btn-submit:active { transform: translateY(0); }
        #loading, #apiLoading { display: none; text-align: center; border-radius: 8px; font-weight: 500; }
        #apiLoading { font-size: 13px; margin-top: 5px; margin-bottom: 20px; color: #0c5460; background-color: #d1ecf1; padding: 10px; border: 1px solid #bee5eb; }
        #loading { margin-top: 20px; color: #856404; background-color: #fff3cd; padding: 15px; border: 1px solid #ffeeba; font-size: 15px; }
        .preview-container { display: none; margin-top: 15px; text-align: center; animation: fadeIn 0.3s ease-in-out; padding: 15px; background-color: var(--bg-color); border-radius: 8px; border: 1px solid var(--border-color); }
        .preview-container p { margin: 0 0 10px 0; font-size: 13px; color: var(--text-muted); font-weight: 500; }
        .preview-container img { max-width: 120px; border-radius: 6px; border: 2px solid var(--border-color); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 600px) { .container { padding: 25px 15px; } .form-row { flex-direction: column; gap: 0; } body { padding: 15px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-section">
            <h2>Kocaeli Sağlık ve Teknoloji Üniversitesi</h2>
            <p>Mesleki Uygulama (Staj) Defteri Otomasyon Sistemi</p>
        </div>
        <form id="stajFormu" enctype="multipart/form-data">
            <h3>Öğrenci Bilgileri</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>İsim Soyisim</label>
                    <input type="text" id="adSoyad" name="adSoyad" value="" required>
                </div>
                <div class="form-group">
                    <label>Öğrenci No</label>
                    <input type="text" id="ogrenciNo" name="ogrenciNo" placeholder="Örn: 2305XXXXX" maxlength="9" oninput="this.value = this.value.replace(/[^0-9]/g, '');" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Okuduğu Bölüm (Otomatik Algılanır)</label>
                    <input type="text" id="bolum" name="bolum" class="locked-input" readonly placeholder="Öğrenci no girildiğinde doldurulur">
                </div>
                <div class="form-group">
                    <label>Kaçıncı Sınıf</label>
                    <select id="sinif" name="sinif" required>
                        <option value="" disabled selected>Sınıf Seçiniz</option>
                        <option value="1. Sınıf">1. Sınıf</option>
                        <option value="2. Sınıf">2. Sınıf</option>
                        <option value="3. Sınıf">3. Sınıf</option>
                        <option value="4. Sınıf">4. Sınıf</option>
                    </select>
                </div>
            </div>
            <div class="form-group full-width">
                <label>Vesikalık Fotoğraf</label>
                <input type="file" id="resim" name="resim" accept="image/png, image/jpeg" required>
                <div id="previewContainer" class="preview-container">
                    <p>Seçilen Fotoğraf Önizlemesi</p>
                    <img id="resimOnizleme" src="" alt="Vesikalık Önizleme">
                </div>
            </div>
            <h3>Kurum ve Staj Bilgileri</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>Kurum Adı</label>
                    <input type="text" id="kurumAdi" name="kurumAdi" placeholder="Staj yapılacak kurumun tam adı" required>
                </div>
                <div class="form-group">
                    <label>Kurum Bölümü / Departman</label>
                    <input type="text" id="kurumBolumu" name="kurumBolumu" placeholder="Örn: Yazılım Geliştirme, Bilgi İşlem" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Staj Başlangıç Tarihi</label>
                    <input type="date" id="baslangicTarihi" name="baslangicTarihi" required>
                </div>
                <div class="form-group">
                    <label>Staj Bitiş Tarihi</label>
                    <input type="date" id="bitisTarihi" name="bitisTarihi" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Haftalık Çalışma Günü</label>
                    <select id="calismaGunu" name="calismaGunu">
                        <option value="5">5 Gün (Pazartesi - Cuma)</option>
                        <option value="6">6 Gün (Pazartesi - Cumartesi)</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Hafta İçi Mesai Başlangıç</label>
                    <input type="time" id="baslamaSaati" name="baslamaSaati" required>
                </div>
                <div class="form-group">
                    <label>Hafta İçi Mesai Bitiş</label>
                    <input type="time" id="bitisSaati" name="bitisSaati" required>
                </div>
            </div>
            <div class="form-row" id="cumartesiSaatleri" style="display: none;">
                <div class="form-group">
                    <label>Cumartesi Mesai Başlangıç</label>
                    <input type="time" id="cBaslamaSaati" name="cBaslamaSaati">
                </div>
                <div class="form-group">
                    <label>Cumartesi Mesai Bitiş</label>
                    <input type="time" id="cBitisSaati" name="cBitisSaati">
                </div>
            </div>
            <div id="apiLoading">📅 Resmi tatiller kontrol ediliyor ve iş günleri hesaplanıyor...</div>
            <div class="form-row">
                <div class="form-group">
                    <label>Hesaplanan Hafta Sayısı</label>
                    <input type="number" id="haftaSayisi" name="haftaSayisi" class="locked-input" readonly>
                </div>
                <div class="form-group">
                    <label>Hesaplanan İş Günü Sayısı (Resmi Tatiller Çıkartılmıştır)</label>
                    <input type="number" id="gunSayisi" name="gunSayisi" class="locked-input" readonly>
                </div>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">Staj Defterini Oluştur ve İndir</button>
            <div id="loading">⏳ Belgeniz sunucuda işleniyor, lütfen bekleyin...</div>
        </form>
    </div>
    <script>
        document.getElementById('resim').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const previewContainer = document.getElementById('previewContainer');
            const previewImage = document.getElementById('resimOnizleme');
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImage.src = e.target.result;
                    previewContainer.style.display = 'block'; 
                }
                reader.readAsDataURL(file);
            } else {
                previewContainer.style.display = 'none';
                previewImage.src = '';
            }
        });
        document.getElementById('ogrenciNo').addEventListener('input', function (e) {
            const ogrenciNo = e.target.value;
            const bolumInput = document.getElementById('bolum');
            if (ogrenciNo.length >= 6) {
                const bolumKodu = ogrenciNo.charAt(5);
                if (bolumKodu === '1') {
                    bolumInput.value = "Bilgisayar Mühendisliği";
                } else if (bolumKodu === '2') {
                    bolumInput.value = "Yazılım Mühendisliği";
                } else {
                    bolumInput.value = "";
                }
            } else {
                bolumInput.value = "";
            }
        });
        const resmiTatillerCache = new Set();
        const cekilenYillar = new Set();
        async function tatilleriGetir(yil) {
            if (cekilenYillar.has(yil)) return;
            try {
                const response = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${yil}/TR`);
                if (response.ok) {
                    const data = await response.json();
                    data.forEach(tatil => resmiTatillerCache.add(tatil.date));
                    cekilenYillar.add(yil);
                }
            } catch (error) {
                console.error("API bağlantı hatası:", error);
            }
        }
        function formatTarih(tarihObj) {
            const yil = tarihObj.getFullYear();
            const ay = String(tarihObj.getMonth() + 1).padStart(2, '0');
            const gun = String(tarihObj.getDate()).padStart(2, '0');
            return `${yil}-${ay}-${gun}`;
        }
        async function tarihleriHesapla() {
            const baslangic = document.getElementById('baslangicTarihi').value;
            const bitis = document.getElementById('bitisTarihi').value;
            const calismaGunu = parseInt(document.getElementById('calismaGunu').value);
            const apiLoading = document.getElementById('apiLoading');
            if (baslangic && bitis) {
                const basTarih = new Date(baslangic);
                const bitTarih = new Date(bitis);
                const basYil = basTarih.getFullYear();
                const bitYil = bitTarih.getFullYear();
                if (basYil < 2000 || bitYil < 2000) return;
                if (bitTarih < basTarih) {
                    alert("Bitiş tarihi başlangıç tarihinden önce olamaz!");
                    document.getElementById('bitisTarihi').value = "";
                    return;
                }
                apiLoading.style.display = 'block';
                await tatilleriGetir(basYil);
                if (basYil !== bitYil) await tatilleriGetir(bitYil);
                let isGunuSayisi = 0;
                let mevcutTarih = new Date(basTarih);
                while (mevcutTarih <= bitTarih) {
                    const haftaninGunu = mevcutTarih.getDay();
                    const tarihString = formatTarih(mevcutTarih);
                    const buGunTatil = resmiTatillerCache.has(tarihString);
                    if (!buGunTatil) {
                        if (calismaGunu === 5 && haftaninGunu !== 0 && haftaninGunu !== 6) {
                            isGunuSayisi++;
                        } else if (calismaGunu === 6 && haftaninGunu !== 0) {
                            isGunuSayisi++;
                        }
                    }
                    mevcutTarih.setDate(mevcutTarih.getDate() + 1);
                }
                const haftaFarki = Math.ceil(isGunuSayisi / calismaGunu);
                document.getElementById('gunSayisi').value = isGunuSayisi;
                document.getElementById('haftaSayisi').value = haftaFarki;
                apiLoading.style.display = 'none';
            }
        }
        document.getElementById('calismaGunu').addEventListener('change', function(e) {
            const isAltigun = e.target.value === '6';
            const cSaatDiv = document.getElementById('cumartesiSaatleri');
            const cBas = document.getElementById('cBaslamaSaati');
            const cBit = document.getElementById('cBitisSaati');
            if(isAltigun) {
                cSaatDiv.style.display = 'flex';
                cBas.required = true;
                cBit.required = true;
            } else {
                cSaatDiv.style.display = 'none';
                cBas.required = false;
                cBit.required = false;
                cBas.value = '';
                cBit.value = '';
            }
            tarihleriHesapla();
        });
        document.getElementById('baslangicTarihi').addEventListener('change', tarihleriHesapla);
        document.getElementById('bitisTarihi').addEventListener('change', tarihleriHesapla);
        document.getElementById('stajFormu').addEventListener('submit', async function (e) {
            e.preventDefault();
            const baslamaSaati = document.getElementById('baslamaSaati').value;
            const bitisSaati = document.getElementById('bitisSaati').value;
            if (baslamaSaati >= bitisSaati) {
                alert("Hafta içi mesai bitiş saati, başlama saatinden daha erken veya aynı olamaz!\nLütfen öğleden sonraki saatler için 24 saatlik dilimi kullanın.");
                return;
            }
            const calismaGunu = document.getElementById('calismaGunu').value;
            if (calismaGunu === '6') {
                const cBaslamaSaati = document.getElementById('cBaslamaSaati').value;
                const cBitisSaati = document.getElementById('cBitisSaati').value;
                if (cBaslamaSaati >= cBitisSaati) {
                    alert("Cumartesi mesai bitiş saati, başlama saatinden daha erken veya aynı olamaz!");
                    return;
                }
            }
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            submitBtn.style.display = 'none';
            loading.style.display = 'block';
            try {
                const formData = new FormData(this);
                const n8nWebhookURL = 'https://scurvy-chosen-circus.ngrok-free.dev/webhook/defter_olustur'; 
                const response = await fetch(n8nWebhookURL, {
                    method: 'POST',
                    body: formData
                });
                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    const ogrenciAdi = document.getElementById('adSoyad').value.replace(/ /g, '_');
                    a.download = ogrenciAdi + '_Staj_Defteri.docx';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                } else {
                    alert("Sunucu hatası: Lütfen n8n iş akışınızı kontrol edin.");
                }
            } catch (error) {
                console.error('Hata:', error);
                alert("Bağlantı hatası oluştu. n8n sunucusuna erişilemiyor.");
            } finally {
                submitBtn.style.display = 'block';
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
